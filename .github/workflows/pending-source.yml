name: Collect pending entry research source
on:
  push:
    branches: [audit/pending-entry-source-2026-10-06]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r analysis_terminal/requirements.txt
      - name: Read public candles using frozen universe
        run: python -m analysis_terminal.run_replay --end-ms 1791255600000 --days 3 --universe-manifest analysis_terminal/replay_latest.json --output recent-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-entry-recent-source
          path: recent-source/
          retention-days: 14

90983800000,"entry":6.325,"stop":6.614866102198796,"target":5.745267795602408,"result":{"status":"OPEN","final_r":null,"mfe_r":0.031,"mae_r":0.1242,"tp1_time_ms":null,"outcome_time_ms":null,"ambiguous_reason":null,"last_price":6.361,"coverage_complete":true,"history_start_ms":1790984700000,"history_end_ms":1790987400000,"candles_checked":4,"evaluation_version":2,"observation_start_ms":1790984700000,"partial_entry_candle_excluded":false}}]'''):
              s = indexed[previous["key"]]

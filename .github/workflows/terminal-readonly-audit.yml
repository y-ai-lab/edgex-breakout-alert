              if result["history_end_ms"] > prior["history_end_ms"]:
                  advanced_since_v5.append({"ticker": s["ticker"], "prior_end_ms": prior["history_end_ms"], "history_end_ms": result["history_end_ms"], "candles_checked": result["candles_checked"], "status": result["status"]})
          assert advanced_since_v5, "No market observation cursor progressed since v19.0.5"
          review = results["review"]["review"]
          screener = results["screener"]

name: Terminal v19.0.6 read-only audit
on:
  push:
    branches: ["audit/terminal-v19-0-6"]
    paths: [".github/workflows/terminal-readonly-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r analysis_terminal/test-requirements.txt
      - name: Terminal and existing regression tests
        run: |
          python -m unittest analysis_terminal.test_outcomes analysis_terminal.test_storage analysis_terminal.test_setups analysis_terminal.test_entry_ui analysis_terminal.test_lifecycle analysis_terminal.test_comparison analysis_terminal.test_tracking -v
          python -m unittest discover -s tests -v
      - name: Read production APIs and validate retained data
        run: |
          python - <<'PY'
          import concurrent.futures, json, urllib.request, time
          from analysis_terminal.setups import setup_identity
          from datetime import datetime, timezone
          from pathlib import Path
          base = "https://edgex-analysis-terminal-production.up.railway.app"
          paths = {
              "index": "/", "health": "/health",
              "screener": "/api/screener?limit=200",
              "analyze": "/api/analyze?ticker=BTCUSDC",
              "review": "/api/readiness-review",
              "shadow": "/api/shadow-v2?limit=2000",
              "push_config": "/api/push/config",
              "push_events": "/api/push/events?limit=1",
              "history": "/api/server-history?hours=720",
              "candidate_events": "/api/candidate-events?limit=500",
              "approach_events": "/api/approach-events?limit=500",
              "approach_validation": "/api/approach-validation?limit=500",
              "opportunity": "/api/opportunity-analysis?limit=500",
              "paper": "/api/server-paper-signals?limit=1000",
              "setups": "/api/setups?limit=500",
              "setups_btc": "/api/setups?limit=5&ticker=BTCUSDC",
              "comparison": "/api/strategy-comparison?limit=500",
              "comparison_one": "/api/strategy-comparison?limit=1",
              "tracking": "/api/outcome-tracking?limit=500",
              "tracking_one": "/api/outcome-tracking?limit=1",
          }
          output = Path("audit-output")
          output.mkdir()
          def fetch(item):
              name, path = item
              with urllib.request.urlopen(base + path, timeout=65) as response:
                  raw = response.read().decode()
                  assert response.status == 200, (name, response.status)
                  data = raw if name == "index" else json.loads(raw)
                  if name == "push_config":
                      data.pop("public_key", None)
                  if name == "push_events":
                      data = {"event_count": len(data.get("events") or [])}
                  (output / (name + (".html" if name == "index" else ".json"))).write_text(
                      raw if name == "index" else json.dumps(data, ensure_ascii=False)
                  )
                  return name, data
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = dict(pool.map(fetch, paths.items()))
          health = results["health"]
          assert health["version"] == "19.0.6", health
          assert health["storage"]["db_exists"]
          assert health["storage"]["market_snapshots_48h"] >= 192
          assert health["push"]["enabled"] and health["push"]["subscribers"] >= 1
          assert results["push_config"]["enabled"]
          history = results["history"]["snapshots"]
          assert len(history) >= 192
          assert set([1790812800000,1790813700000,1790814600000,1790815500000,1790816400000,1790817300000,1790818200000,1790819100000,1790820000000,1790820900000,1790821800000,1790822700000,1790823600000,1790824500000,1790825400000,1790826300000,1790827200000,1790828100000,1790829000000,1790829900000,1790830800000,1790831700000,1790832600000,1790833500000,1790834400000,1790835300000,1790836200000,1790837100000,1790838000000,1790838900000,1790839800000,1790840700000,1790841600000,1790842500000,1790843400000,1790844300000,1790845200000,1790846100000,1790847000000,1790847900000,1790848800000,1790849700000,1790850600000,1790851500000,1790852400000,1790853300000,1790854200000,1790855100000,1790856000000,1790856900000,1790857800000,1790858700000,1790859600000,1790860500000,1790861400000,1790862300000,1790863200000,1790864100000,1790865000000,1790865900000,1790866800000,1790867700000,1790868600000,1790869500000,1790870400000,1790871300000,1790872200000,1790873100000,1790874000000,1790874900000,1790875800000,1790876700000,1790877600000,1790878500000,1790879400000,1790880300000,1790881200000,1790882100000,1790883000000,1790883900000,1790884800000,1790885700000,1790886600000,1790887500000,1790888400000,1790889300000,1790890200000,1790891100000,1790892000000,1790892900000,1790893800000,1790894700000,1790895600000,1790896500000,1790897400000,1790898300000,1790899200000,1790900100000,1790901000000,1790901900000,1790902800000,1790903700000,1790904600000,1790905500000,1790906400000,1790907300000,1790908200000,1790909100000,1790910000000,1790910900000,1790911800000,1790912700000,1790913600000,1790914500000,1790915400000,1790916300000,1790917200000,1790918100000,1790919000000,1790919900000,1790920800000,1790921700000,1790922600000,1790923500000,1790924400000,1790925300000,1790926200000,1790927100000,1790928000000,1790928900000,1790929800000,1790930700000,1790931600000,1790932500000,1790933400000,1790934300000,1790935200000,1790936100000,1790937000000,1790937900000,1790938800000,1790939700000,1790940600000,1790941500000,1790942400000,1790943300000,1790944200000,1790945100000,1790946000000,1790946900000,1790947800000,1790948700000,1790949600000,1790950500000,1790951400000,1790952300000,1790953200000,1790954100000,1790955000000,1790955900000,1790956800000,1790957700000,1790958600000,1790959500000,1790960400000,1790961300000,1790962200000,1790963100000,1790964000000,1790964900000,1790965800000,1790966700000,1790967600000,1790968500000,1790969400000,1790970300000,1790971200000,1790972100000,1790973000000,1790973900000,1790974800000,1790975700000,1790976600000,1790977500000,1790978400000,1790979300000,1790980200000,1790981100000,1790982000000,1790982900000,1790983800000,1790984700000,1790985600000,1790986500000,1790987400000,1790988300000]) <= {s["time_ms"] for s in history}
          shadow = results["shadow"]
          for s in shadow["latest"]:
              assert s["created_ms"] == s["signal_candle_ms"] + 900000 + 1
              r = s.get("result") or {}
              if r.get("evaluation_version") == 2 and r.get("history_start_ms") is not None:
                  assert r["history_start_ms"] >= s["created_ms"] - 1
                  if r.get("status") in {"TP", "SL", "AMBIGUOUS"}:
                      assert r["outcome_time_ms"] >= s["created_ms"] - 1
                      assert r["history_end_ms"] == r["outcome_time_ms"]
          lifecycle = results["setups"]
          assert lifecycle["tracked"] == sum(lifecycle["status_counts"].values())
          setups = {s["setup_id"]: s for s in lifecycle["items"]}
          assert set(["v2:setup-v1:MRVLUSDC:LONG:1790928000000:273.07","v2:setup-v1:SAMSUNGUSDC:LONG:1790942400000:205.74","v2:setup-v1:UBUSDC:SHORT:1790956800000:0.13716","v2:setup-v1:SKHYUSDC:LONG:1790942400000:193.97","v2:setup-v1:PIEVERSEUSDC:SHORT:1790942400000:1.3739","v2:setup-v1:XLVUSDC:SHORT:1790884800000:166.7","v2:setup-v1:SKDDUSDC:SHORT:1790942400000:6.353"]).issubset({"v2:" + s for s in setups})
          assert any(s["market_observed_ms"] is not None for s in setups.values())
          for s in setups.values():
              assert s["setup_id"] == setup_identity(s)
              assert s["last_observed_ms"] >= s["first_seen_ms"]
              if s["status"] in {"EXPIRED", "INVALIDATED"}:
                  assert s["ended_ms"] >= s["first_seen_ms"] and s["end_reason"]
              for field in ("current_trade", "shadow_trade"):
                  t = s.get(field)
                  if t and (t.get("result") or {}).get("status") == "OPEN":
                      assert "final_r" not in t["result"] or t["result"]["final_r"] is None
          comparison = results["comparison"]
          assert comparison["sample_basis"] == "unique_setup_first_recorded_entry_all_history"
          assert comparison["automatic_promotion"] is False
          groups = comparison["groups"]
          assert comparison["current"]["signals"] == groups["current_only"]["setups"] + groups["both"]["setups"]
          assert comparison["shadow"]["signals"] == groups["shadow_only"]["setups"] + groups["both"]["setups"]
          assert comparison["exclusions"]["shadow"]["legacy_unidentified"] >= 297
          assert len(results["comparison_one"]["latest"]) <= 1
          for name in ("current", "shadow"):
              m = comparison[name]
              assert m["resolved"] == m["tp"] + m["sl"]
              assert m["avg_r"] == m["expectancy_r"]
              if m["resolved"] < 20:
                  assert m["sample_status"] == "INSUFFICIENT SAMPLE"
              for field in ("win_rate", "avg_r", "profit_factor", "avg_mfe_r", "avg_mae_r", "max_consecutive_losses", "expectancy_r"):
                  assert field in m
          assert comparison["paired"]["resolved"] <= groups["both"]["setups"]
          assert comparison["paired"]["current"]["resolved"] == comparison["paired"]["shadow"]["resolved"] == comparison["paired"]["resolved"]
          indexed_shadow = {s["key"]: s for s in shadow["latest"]}
          for previous in [{"key":"v2:setup-v1:PDDUSDC:SHORT:1790942400000:75.77","created_ms":1790987400001,"signal_candle_ms":1790986500000,"entry":75.69,"stop":76.69119147434694,"target":73.68761705130612},{"key":"v2:setup-v1:MRVLUSDC:LONG:1790928000000:273.07","created_ms":1790985600001,"signal_candle_ms":1790984700000,"entry":273.31,"stop":269.3025281946332,"target":281.32494361073356},{"key":"v2:setup-v1:SAMSUNGUSDC:LONG:1790942400000:205.74","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":205.97,"stop":201.61009333951148,"target":214.68981332097704},{"key":"v2:setup-v1:UBUSDC:SHORT:1790956800000:0.13716","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":0.13647,"stop":0.1420004371893643,"target":0.1254091256212714},{"key":"v2:setup-v1:SKHYUSDC:LONG:1790942400000:193.97","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":194.18,"stop":190.12263776975863,"target":202.29472446048277},{"key":"v2:setup-v1:PIEVERSEUSDC:SHORT:1790942400000:1.3739","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":1.3699,"stop":1.40033162792759,"target":1.3090367441448199},{"key":"v2:setup-v1:XLVUSDC:SHORT:1790884800000:166.7","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":166.25,"stop":168.01781217676339,"target":162.71437564647323},{"key":"v2:setup-v1:SKDDUSDC:SHORT:1790942400000:6.353","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":6.325,"stop":6.614866102198796,"target":5.745267795602408}]:
              assert previous["key"] in indexed_shadow
              for field in ("created_ms", "signal_candle_ms", "entry", "stop", "target"):
                  assert indexed_shadow[previous["key"]][field] == previous[field], (previous["key"], field)
          for row in comparison["latest"]:
              assert row["group"] in {"both", "current_only", "shadow_only"}
              for name in ("current", "shadow"):
                  s = row.get(name)
                  if s:
                      r = s.get("result") or {}
                      if r.get("evaluation_version") == 2 and r.get("history_start_ms") is not None:
                          assert r["history_start_ms"] >= s["created_ms"] - 1
          metrics = shadow["metrics"]
          assert metrics["sample_basis"] == "unique_setup_first_entry"
          assert metrics["legacy_unidentified_signals"] >= 297
          assert metrics["duplicate_setup_signals"] == 0
          if metrics["resolved"] < 20:
              assert not metrics["decision_ready"] and not metrics["promotion_pass"]
              assert metrics["sample_status"] == "INSUFFICIENT SAMPLE"
          setup_signals = [s for s in shadow["latest"] if s.get("setup_id")]
          assert len(set(s["setup_id"] for s in setup_signals)) == len(setup_signals)
          assert metrics["setup_tracked"] >= 6
          assert set(["v2:setup-v1:MRVLUSDC:LONG:1790928000000:273.07","v2:setup-v1:SAMSUNGUSDC:LONG:1790942400000:205.74","v2:setup-v1:UBUSDC:SHORT:1790956800000:0.13716","v2:setup-v1:SKHYUSDC:LONG:1790942400000:193.97","v2:setup-v1:PIEVERSEUSDC:SHORT:1790942400000:1.3739","v2:setup-v1:XLVUSDC:SHORT:1790884800000:166.7","v2:setup-v1:SKDDUSDC:SHORT:1790942400000:6.353"]) <= {s["key"] for s in setup_signals}
          for s in setup_signals:
              assert s["setup_id"] == setup_identity(dict(s, direction=s["side"]))
              assert s["key"] == "v2:" + s["setup_id"]
          for row in results["screener"]["results"]:
              if row.get("breakout_time_ms"):
                  assert row["setup_id"] == setup_identity(row)
          # Confirm the collector/API do not rewrite the original entry for a setup.
          time.sleep(15)
          _, again = fetch(("shadow_repeat", paths["shadow"]))
          indexed = {s["key"]: s for s in again["latest"]}
          for s in setup_signals:
              if s["key"] in indexed:
                  for field in ("created_ms", "signal_candle_ms", "entry", "stop", "target"):
                      assert s[field] == indexed[s["key"]][field], (s["key"], field)
          results["shadow_repeat"] = again
          # Wait for the startup collector's first completed result refresh.
          tracking = results["tracking"]
          for _ in range(10):
              if all((tracking["models"][name]["last_refresh"] or {}).get("finished_ms") for name in ("current", "shadow")):
                  break
              time.sleep(10)
              _, tracking = fetch(("tracking_ready", paths["tracking"]))
          assert all((tracking["models"][name]["last_refresh"] or {}).get("finished_ms") for name in ("current", "shadow")), tracking
          assert tracking["interval_ms"] == 900000
          for name, model in tracking["models"].items():
              total, cohort = model["all_records"], model["setup_cohort"]
              report = model["last_refresh"]
              assert total["records"] >= cohort["records"]
              assert total["pending"] >= cohort["pending"]
              assert sum(total["quality_counts"].values()) == total["records"]
              assert len(results["tracking_one"]["models"][name]["setup_cohort"]["pending_items"]) <= 1
              assert report["status"] in {"OK", "PARTIAL", "ERROR"}
              assert report["finished_ms"] >= report["started_ms"]
              assert report["evaluated"] + report["missing_contract"] + report["missing_snapshot"] <= report["selected"]
              assert 0 <= report["advanced"] <= report["evaluated"]
          tracked = tracking["models"]["shadow"]["setup_cohort"]
          assert tracked["records"] >= 8
          assert tracked["overdue"] == 0 and tracked["incomplete_history"] == 0, tracked
          assert tracked["quality_counts"].get("DATA_ERROR", 0) == 0
          _, current_shadow = fetch(("shadow_tracking_check", paths["shadow"]))
          indexed = {s["key"]: s for s in current_shadow["latest"]}
          advanced_since_v5 = []
          for previous in json.loads(r'''[{"key":"v2:setup-v1:PDDUSDC:SHORT:1790942400000:75.77","created_ms":1790987400001,"signal_candle_ms":1790986500000,"entry":75.69,"stop":76.69119147434694,"target":73.68761705130612,"result":{"status":"OPEN","final_r":null,"mfe_r":0.01,"mae_r":0.0499,"tp1_time_ms":null,"outcome_time_ms":null,"ambiguous_reason":null,"last_price":75.73,"coverage_complete":true,"history_start_ms":1790987400000,"history_end_ms":1790987400000,"candles_checked":1,"evaluation_version":2,"observation_start_ms":1790987400000,"partial_entry_candle_excluded":false}},{"key":"v2:setup-v1:MRVLUSDC:LONG:1790928000000:273.07","created_ms":1790985600001,"signal_candle_ms":1790984700000,"entry":273.31,"stop":269.3025281946332,"target":281.32494361073356,"result":{"status":"OPEN","final_r":null,"mfe_r":0.1323,"mae_r":0.1697,"tp1_time_ms":null,"outcome_time_ms":null,"ambiguous_reason":null,"last_price":272.63,"coverage_complete":true,"history_start_ms":1790985600000,"history_end_ms":1790987400000,"candles_checked":3,"evaluation_version":2,"observation_start_ms":1790985600000,"partial_entry_candle_excluded":false}},{"key":"v2:setup-v1:SAMSUNGUSDC:LONG:1790942400000:205.74","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":205.97,"stop":201.61009333951148,"target":214.68981332097704,"result":{"status":"OPEN","final_r":null,"mfe_r":0.117,"mae_r":0.0573,"tp1_time_ms":null,"outcome_time_ms":null,"ambiguous_reason":null,"last_price":205.74,"coverage_complete":true,"history_start_ms":1790984700000,"history_end_ms":1790987400000,"candles_checked":4,"evaluation_version":2,"observation_start_ms":1790984700000,"partial_entry_candle_excluded":false}},{"key":"v2:setup-v1:UBUSDC:SHORT:1790956800000:0.13716","created_ms":1790984700001,"signal_candle_ms":1790983800000,"entry":0.13647,"stop":0.1420004371893643,"target":0.1254091256212714,"result":{"status":"OPEN","final_r":null,"mfe_r":0.1121,"mae_r":0.0922,"tp1_time_ms":null,"outcome_time_ms":null,"ambiguous_r
name: EdgeX breakout scan v2

on:
  schedule:
    # Long-lived runner: start every 6 hours and scan every 4 minutes for ~5h50m.
    - cron: "7 0,6,12,18 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/edgex-breakout-scan-v2.yml"
      - "app.py"
      - "production_app.py"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send one Telegram test message"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# A code/config update must replace the old long-lived scanner instead of
# waiting up to ~6 hours for it to finish. Scheduled overlaps are also safely
# collapsed to the newest run.
concurrency:
  group: edgex-breakout-scan-v2
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EDGEX_EQUITY_USDC: "24"
      EDGEX_AVAILABLE_BALANCE_USDC: ${{ secrets.EDGEX_AVAILABLE_BALANCE_USDC }}
      EDGEX_LEVERAGE: ${{ secrets.EDGEX_LEVERAGE }}
      EDGEX_ACCOUNT_ID: ${{ secrets.EDGEX_ACCOUNT_ID }}
      EDGEX_API_KEY: ${{ secrets.EDGEX_API_KEY }}
      EDGEX_API_PASSPHRASE: ${{ secrets.EDGEX_API_PASSPHRASE }}
      EDGEX_API_SECRET: ${{ secrets.EDGEX_API_SECRET }}
      EDGE_X_RISK_PER_TRADE: "0.05"
      EDGE_X_MONITOR_INTERVAL: HOUR_4
      EDGE_X_ENTRY_INTERVAL: MINUTE_15
      EDGE_X_INTERVALS: HOUR_4,MINUTE_15
      EDGE_X_TREND_FAST_EMA: "20"
      EDGE_X_TREND_SLOW_EMA: "50"
      EDGE_X_MIN_TREND_GAP_ATR: "0.35"
      EDGE_X_ROLL_LOOKBACK: "20"
      EDGE_X_ROLL_MAX_AGE: "6"
      EDGE_X_RETEST_LOOKBACK: "4"
      EDGE_X_ATR_PERIOD: "14"
      EDGE_X_ATR_STOP_BUFFER: "0.5"
      EDGE_X_ATR_TARGET_BUFFER: "0.25"
      EDGE_X_RETEST_ATR_TOLERANCE: "0.35"
      EDGE_X_MIN_RR: "2.0"
      EDGE_X_SPLIT_RR: "3.0"
      EDGE_X_PULLBACK_SWING_LOOKBACK: "5"
      EDGE_X_HISTORY_SIZE: "96"
      EDGE_X_ALERT_COOLDOWN_MINUTES: "0"
      DRY_RUN: "false"
      STATE_BACKEND: json
      STATE_FILE: data/edgex_alert_state.json
      EDGE_X_INCLUDE_HIDDEN: "true"
      TIMEZONE: Asia/Tokyo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Send one Telegram test message
        if: ${{ inputs.test_telegram == true }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          body = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": "✅ EdgeX監視のテスト通知です。Telegram送信は正常です。",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"Telegram test failed: {type(exc).__name__}") from exc
          if not isinstance(payload, dict) or not payload.get("ok"):
              raise SystemExit("Telegram test failed: API returned an error")
          print("Telegram test message sent")
          PY

      - name: Scan all tradable EdgeX contracts continuously
        shell: bash
        run: |
          set -euo pipefail
          end_epoch=$(( $(date +%s) + 21000 ))

          while [ "$(date +%s)" -lt "$end_epoch" ]; do
            echo "Starting EdgeX News scan at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            python production_app.py --once --once-timeout 90 --log-level INFO

            if [ -n "$(git status --porcelain -- data/edgex_alert_state.json)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add data/edgex_alert_state.json
              git commit -m "chore: update EdgeX alert state"
              git pull --rebase origin main
              git push
            fi

            remaining=$(( end_epoch - $(date +%s) ))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            sleep_seconds=240
            if [ "$remaining" -lt "$sleep_seconds" ]; then
              sleep_seconds="$remaining"
            fi
            echo "Next EdgeX News scan in ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done

      - name: Session summary
        if: ${{ always() }}
        run: echo "EdgeX News scanner session ended at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

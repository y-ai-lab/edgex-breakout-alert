name: EdgeX breakout scan v2 (manual backup)

# Production monitoring now runs continuously on Railway.
# Keep this workflow only as a manually-invoked backup / Telegram test path so
# GitHub Actions cannot duplicate market scans or Telegram alerts.
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send one Telegram test message"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: edgex-breakout-scan-v2-manual-backup
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EDGEX_EQUITY_USDC: "24"
      EDGEX_AVAILABLE_BALANCE_USDC: ${{ secrets.EDGEX_AVAILABLE_BALANCE_USDC }}
      EDGEX_LEVERAGE: ${{ secrets.EDGEX_LEVERAGE }}
      EDGEX_ACCOUNT_ID: ${{ secrets.EDGEX_ACCOUNT_ID }}
      EDGEX_API_KEY: ${{ secrets.EDGEX_API_KEY }}
      EDGEX_API_PASSPHRASE: ${{ secrets.EDGEX_API_PASSPHRASE }}
      EDGEX_API_SECRET: ${{ secrets.EDGEX_API_SECRET }}
      EDGE_X_RISK_PER_TRADE: "0.05"
      EDGE_X_MONITOR_INTERVAL: HOUR_4
      EDGE_X_ENTRY_INTERVAL: MINUTE_15
      EDGE_X_INTERVALS: HOUR_4,MINUTE_15
      EDGE_X_TREND_FAST_EMA: "20"
      EDGE_X_TREND_SLOW_EMA: "50"
      EDGE_X_MIN_TREND_GAP_ATR: "0.35"
      EDGE_X_ROLL_LOOKBACK: "20"
      EDGE_X_ROLL_MAX_AGE: "6"
      EDGE_X_RETEST_LOOKBACK: "4"
      EDGE_X_ATR_PERIOD: "14"
      EDGE_X_ATR_STOP_BUFFER: "0.5"
      EDGE_X_ATR_TARGET_BUFFER: "0.25"
      EDGE_X_RETEST_ATR_TOLERANCE: "0.35"
      EDGE_X_MIN_RR: "2.0"
      EDGE_X_SPLIT_RR: "3.0"
      EDGE_X_PULLBACK_SWING_LOOKBACK: "5"
      EDGE_X_HISTORY_SIZE: "96"
      EDGE_X_ALERT_COOLDOWN_MINUTES: "0"
      DRY_RUN: "false"
      EDGE_X_INCLUDE_HIDDEN: "true"
      TIMEZONE: Asia/Tokyo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Send one Telegram test message
        if: ${{ inputs.test_telegram == true }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          body = urllib.parse.urlencode({"chat_id": chat_id, "text": "✅ EdgeX監視バックアップ経路のテスト通知です。"}).encode("utf-8")
          request = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=body, headers={"Content-Type": "application/x-www-form-urlencoded"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          if not isinstance(payload, dict) or not payload.get("ok"):
              raise SystemExit("Telegram test failed")
          print("Telegram test message sent")
          PY

      - name: Run one backup scan
        if: ${{ inputs.test_telegram != true }}
        run: python production_app.py --once --once-timeout 90 --log-level INFO

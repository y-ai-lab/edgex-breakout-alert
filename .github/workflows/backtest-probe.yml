name: Backtest API probe

on:
  push:
    branches:
      - backtest/last-month
    paths:
      - ".github/workflows/backtest-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe EdgeX kline API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base="https://edgex-prod-v2.edgex.exchange"
          meta_url=base+"/api/v2/public/meta/getMetaData"
          with urllib.request.urlopen(meta_url, timeout=30) as r:
              meta=json.load(r)
          contracts=(meta.get("data") or {}).get("contractList") or []
          cid=str(next(x["contractId"] for x in contracts if x.get("enableTrade")))
          params={
              "contractId":cid,
              "klineType":"MINUTE_15",
              "priceType":"LAST_PRICE",
              "size":"5",
          }
          url=base+"/api/v2/public/quote/getKline?"+urllib.parse.urlencode(params)
          with urllib.request.urlopen(url, timeout=30) as r:
              payload=json.load(r)
          print("CONTRACT", cid)
          print(json.dumps(payload, ensure_ascii=False)[:12000])
          PY

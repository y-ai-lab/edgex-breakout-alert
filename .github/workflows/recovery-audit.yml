name: Frozen cutoff recovery validation
on:
  push:
    branches: [audit/pending-recovery-v19-0-27]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis_terminal/test-requirements.txt
      - name: Regression, time order, frozen identity and artifact tests
        run: |
          mkdir -p validation-output
          python -m unittest discover -s analysis_terminal -p 'test_*.py' -q > validation-output/analysis-tests.txt 2>&1
          python -m unittest discover -s tests -q > validation-output/root-tests.txt 2>&1
          python -m compileall -q analysis_terminal
          python -m analysis_terminal.pending_followup --scheduled --output validation-output/calendar
          python -m analysis_terminal.pending_followup --scheduled --finalize-previous --output validation-output/recovery-calendar
      - name: Verify prior production strategy and unrelated files are unchanged
        run: |
          python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          old=subprocess.check_output(['git','show','40cda5f86e22efe41d936b0f6e9d0354e7495b42:analysis_terminal/server.py'],text=True)
          new=Path('analysis_terminal/server.py').read_text()
          def strategy(s):return ast.dump(next(n for n in ast.parse(s).body if isinstance(n,ast.FunctionDef) and n.name=='analyze_contract'),include_attributes=False)
          assert strategy(old)==strategy(new)
          for p in ['app.py','production_app.py','Dockerfile','requirements.txt','analysis_terminal/index.html','analysis_terminal/btc.html','analysis_terminal/sw.js','analysis_terminal/pending_entry_protocol.json']:
              assert subprocess.check_output(['git','show','40cda5f86e22efe41d936b0f6e9d0354e7495b42:'+p])==Path(p).read_bytes(),p
          PY
      - name: Read-only GitHub archive filter smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from analysis_terminal.pending_followup import gh_json
          listing=gh_json('repos/y-ai-lab/edgex-breakout-alert/actions/artifacts?name=edgex-followup-readonly-filter-probe-never-produced&per_page=100')
          assert listing['total_count']==0 and listing['artifacts']==[]
          print('PASS: authenticated read-only archive query supports exact name filtering')
          PY
      - name: Obtain exact SHA-verified frozen ledger and subsequent market data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/y-ai-lab/edgex-breakout-alert/actions/artifacts/11262672328/zip > development.zip
          gh api repos/y-ai-lab/edgex-breakout-alert/actions/artifacts/11430177364/zip > subsequent.zip
          gh api repos/y-ai-lab/edgex-breakout-alert/actions/artifacts/11431586665/zip > frozen.zip
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          digests={'development':'163fb6eb7947f1284dcb953d0bb8e39f1f1535a71b5778260c2a373c4f7c8a9c','subsequent':'820cc3a94c876f569e9eb410829d89f5d4af7fc5c90470d4d50071046ca0b1df','frozen':'21b77e1ef3396504d15db3c3832190834b77519ff545540389d28bd8ddeb634b'}
          for name,digest in digests.items():
              raw=Path(name+'.zip').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest
              out=Path('source-input')/name;out.mkdir(parents=True)
              with zipfile.ZipFile(Path(name+'.zip')) as z:
                  for info in z.infolist():
                      assert (out/info.filename).resolve().is_relative_to(out.resolve())
                  z.extractall(out)
          PY
      - name: Continue the existing development cohort using subsequent closed candles
        run: |
          python - <<'PY'
          import copy,hashlib,json
          from pathlib import Path
          import app as scanner
          from analysis_terminal import pending_entry_replay as study,pending_followup as follow,server
          def source_at(folder):
              found=list(folder.rglob('replay-report.json'));assert len(found)==1
              return found[0].parent,json.loads(found[0].read_text())
          devdir,dev=source_at(Path('source-input/development'))
          laterdir,later=source_at(Path('source-input/subsequent'))
          candidates=list(Path('source-input/frozen').rglob('development/report.json'));assert len(candidates)==1
          base=json.loads(candidates[0].read_text());before=copy.deepcopy(base)
          candles={}
          verified=0
          for directory,source in ((devdir,dev),(laterdir,later)):
              for item in source['manifest']['sources']:
                  path=(directory/item['file']).resolve();assert path.is_relative_to(directory.resolve())
                  raw=path.read_bytes();assert hashlib.sha256(raw).hexdigest()==item['sha256']
                  verified+=1
                  if source is later:
                      data=json.loads(raw)
                      candles[item['ticker']]=[scanner.Candle(**c) for c in data['MINUTE_15']]
          # The changed evaluator's default path reproduces every original entry,
          # outcome and portfolio before the separate follow-up is calculated.
          reproduced=study.run(devdir,server.analyze_contract,server.SETTINGS,role='development')
          for field in ('records','metrics','portfolios','opportunities'):assert reproduced[field]==base[field],field
          report=follow.extend(base,dev,candles,end_ms=later['end_ms'])
          assert base==before
          assert len(report['records'])==len(base['records'])
          for old,new in zip(base['records'],report['records']):
              for field in ('key','setup_id','created_ms','filled_ms','entry','stop','target','trigger'):
                  assert new.get(field)==old.get(field),field
              if old['status']!='OPEN':assert old==new
          report.update(base_report_sha256=hashlib.sha256(candidates[0].read_bytes()).hexdigest(),source_files_verified=verified,role='VIEWED_RETROSPECTIVE_FOLLOWUP_NOT_HOLDOUT')
          out=Path('validation-output')
          (out/'market-followup-report.json').write_text(json.dumps(report,indent=2,allow_nan=False))
          summary={k:v for k,v in report.items() if k!='records'}
          (out/'market-followup-summary.json').write_text(json.dumps(summary,indent=2,allow_nan=False))
          assert hashlib.sha256((out/'market-followup-summary.json').read_bytes()).hexdigest()=='e11ef813509634608e9330e20057a73f22c131ea1193050519d2e3a37b5d653c','Original market follow-up changed'
          print(json.dumps({'newly_resolved':report['newly_resolved'],'original':base['metrics'][study.MODEL],'followup':report['metrics'][study.MODEL],'verified_files':verified}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-recovery-validation
          path: validation-output/
          retention-days: 14

name: Pending continuous capital regressions
on:
  push:
    branches: [audit/pending-continuous-v19-0-37]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis_terminal/test-requirements.txt
      - name: Full regressions including capital carried between weeks
        run: |
          mkdir -p validation-output
          python -m unittest discover -s analysis_terminal -p 'test_*.py' -q > validation-output/analysis-tests.txt 2>&1
          python -m unittest discover -s tests -q > validation-output/root-tests.txt 2>&1
          python -m unittest discover -s .github/scripts -p 'test_*.py' -q > validation-output/review-tests.txt 2>&1
          python -m compileall -q analysis_terminal
      - name: Only portfolio report, fixture, documentation and release marker change
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          parent='9173d27cf4347ce6184fed4993405680a02ee8f5'
          changed={'analysis_terminal/pending_live.py','analysis_terminal/test_pending_live.py','analysis_terminal/PENDING_LIVE_CAPTURE.md','analysis_terminal/server.py','.github/workflows/pending-continuous-validation.yml'}
          diff=subprocess.check_output(['git','diff','--name-only',parent,'HEAD']).decode().splitlines()
          assert set(diff)==changed,diff
          old=subprocess.check_output(['git','show',parent+':analysis_terminal/server.py']).decode()
          assert old.replace('version="19.0.36"','version="19.0.37"')==Path('analysis_terminal/server.py').read_text()
          assert subprocess.check_output(['git','show','42c46292c3406e61edfe1bba9bb3deb16095cd6a:analysis_terminal/pending_live_protocol.json'])==Path('analysis_terminal/pending_live_protocol.json').read_bytes()
          import ast
          prior=subprocess.check_output(['git','show',parent+':analysis_terminal/pending_live.py']).decode()
          current=Path('analysis_terminal/pending_live.py').read_text()
          def funcs(s):return {n.name:ast.dump(n,include_attributes=False) for n in ast.parse(s).body if isinstance(n,ast.FunctionDef) and n.name!='review'}
          assert funcs(prior)==funcs(current),'Capture, fills, states, cursors or migration changed'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-continuous-validation
          path: validation-output/
          retention-days: 14

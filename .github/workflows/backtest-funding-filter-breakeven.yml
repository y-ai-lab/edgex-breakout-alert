name: Backtest funding-aligned 1R breakeven
on:
  push:
    branches: [backtest/funding-filter-breakeven]
    paths:
      - 'backtest_funding_filter_breakeven.py'
      - '.github/workflows/backtest-funding-filter-breakeven.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        trend_gap_atr: ['0.15', '0.25', '0.35', '0.50']
    env:
      EDGEX_EQUITY_USDC: '24'
      EDGE_X_RISK_PER_TRADE: '0.05'
      EDGE_X_MONITOR_INTERVAL: 'HOUR_4'
      EDGE_X_ENTRY_INTERVAL: 'MINUTE_15'
      EDGE_X_MIN_RR: '2'
      EDGE_X_SPLIT_RR: '3'
      EDGE_X_MIN_TREND_GAP_ATR: ${{ matrix.trend_gap_atr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run funding-aligned 1R breakeven backtest
        run: python backtest_funding_filter_breakeven.py

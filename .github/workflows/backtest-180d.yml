name: Backtest deduped 180 days

on:
  push:
    branches:
      - backtest/180d-deduped
    paths:
      - ".github/workflows/backtest-180d.yml"
      - "backtest_180_days.py"
      - "app.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py backtest_180_days.py

      - name: Run 180-day deduped backtest
        env:
          DRY_RUN: "true"
          EDGEX_EQUITY_USDC: "24"
          EDGE_X_RISK_PER_TRADE: "0.05"
          EDGE_X_MONITOR_INTERVAL: HOUR_4
          EDGE_X_ENTRY_INTERVAL: MINUTE_15
          EDGE_X_INTERVALS: HOUR_4,MINUTE_15
          EDGE_X_TREND_FAST_EMA: "20"
          EDGE_X_TREND_SLOW_EMA: "50"
          EDGE_X_ROLL_LOOKBACK: "20"
          EDGE_X_ROLL_MAX_AGE: "6"
          EDGE_X_RETEST_LOOKBACK: "4"
          EDGE_X_ATR_PERIOD: "14"
          EDGE_X_ATR_STOP_BUFFER: "0.5"
          EDGE_X_ATR_TARGET_BUFFER: "0.25"
          EDGE_X_RETEST_ATR_TOLERANCE: "0.35"
          EDGE_X_MIN_RR: "2.0"
          EDGE_X_SPLIT_RR: "3.0"
          EDGE_X_PULLBACK_SWING_LOOKBACK: "5"
          EDGE_X_HISTORY_SIZE: "96"
        run: python backtest_180_days.py

      - name: Commit backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results/deduped_180d_summary.json backtest_results/deduped_180d_trades.csv
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "chore: save deduped 180-day backtest results"
          git pull --rebase origin backtest/180d-deduped
          git push origin HEAD:backtest/180d-deduped

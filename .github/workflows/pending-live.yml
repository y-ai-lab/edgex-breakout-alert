name: Research publication live read-only smoke
on:
  push:
    branches: [audit/pending-entry-live-2026-10-06]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public production API and persistence smoke
        run: |
          python - <<'PY'
          import json,re,subprocess,time,urllib.request,urllib.error,urllib.parse,hashlib
          from pathlib import Path
          baseline=json.loads(Path('audit-input/research-baseline.json').read_text())
          base='https://edgex-analysis-terminal-production.up.railway.app'
          out=Path('live-output');out.mkdir(exist_ok=True)
          checks=[]
          def fetch(path,expected=200,raw=False,post=False):
              data=b'{}' if post else None
              request=urllib.request.Request(base+path,data=data,headers={'User-Agent':'EdgeX-read-only-smoke','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=60) as r:
                      status,text=r.status,r.read().decode()
              except urllib.error.HTTPError as e:status,text=e.code,e.read().decode()
              assert status==expected,(path,status)
              checks.append(dict(path=path,status=status,method='POST_INVALID_BODY' if post else 'GET'))
              return text if raw else json.loads(text)
          h=fetch('/health')
          assert h['ok'] and h['version']=='19.0.23'
          assert h['storage']['db_exists'] and h['storage']['paper_signals']>=baseline['health']['storage']['paper_signals']
          assert h['storage']['market_snapshots_48h']>=1
          assert h['push']['subscribers']==baseline['health']['push']['subscribers']==1
          assert h['push']['enabled'] and h['push']['notification_policy']=='READY_ONLY' and not h['push']['daily_summary_enabled']
          for route,file in [('/','analysis_terminal/index.html'),('/btc','analysis_terminal/btc.html')]:
              html=fetch(route,raw=True)
              assert html==Path(file).read_text().replace('__APP_VERSION__',h['version']),'Published UI differs from rendered approved main'
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
              scripts=[s for s in scripts if s.strip()]
              assert scripts
              for s in scripts:
                  proc=subprocess.run(['node','-e','new Function(require("fs").readFileSync(0,"utf8"))'],input=s,text=True,capture_output=True)
                  assert proc.returncode==0,proc.stderr
          p=fetch('/api/paper-execution?limit=200')
          assert p['mode']=='PAPER_ONLY' and not p['real_orders_enabled'] and not p['automatic_promotion']
          for field in ['activated_ms','policy','event_tracking_started_ms']:
              assert p['account'][field]==baseline['paper']['account'][field],field
          for previous in baseline['paper']['latest']:
              current=next(o for o in p['latest'] if o['order_id']==previous['order_id'])
              for field in ['order_id','setup_id','created_ms','ticker']:
                  assert current[field]==previous[field],field
          assert p['account']['last_error'] is None
          pc=fetch('/api/push/config');pc.pop('public_key',None)
          assert pc['subscribers']==1 and pc['notification_policy']=='READY_ONLY'
          fetch('/api/push/events')
          fetch('/api/push/preferences',expected=422)
          for path in ['/api/push/subscribe','/api/push/unsubscribe','/api/push/preferences','/api/push/test']:
              fetch(path,expected=422,post=True)
          assert fetch('/api/push/config')['subscribers']==1
          fetch('/api/screener')
          fetch('/api/analyze?ticker=BTCUSDC')
          fetch('/api/paper-execution/events?limit=200')
          history=fetch('/api/server-history?hours=48')
          assert history['snapshots']
          fetch('/api/readiness-review')
          fetch('/api/readiness-history?days=14')
          shadow=fetch('/api/shadow-v2?limit=1000')
          for attempt in range(10):
              btc=fetch('/api/btc-wave')
              if not btc['stale'] and btc['latest'] and btc['latest']['status']=='OBSERVING':break
              time.sleep(10)
          else:raise AssertionError('BTC collector not fresh after deployment')
          assert btc['mode']=='SHADOW_ONLY' and not btc['real_orders_enabled'] and not btc['automatic_promotion']
          assert btc['recorded_observations']>=baseline['btc']['recorded_observations']
          assert btc['metrics']['signals']>=baseline['btc']['metrics']['signals']
          assert fetch('/health')['push']['subscribers']==1
          summary=dict(verdict='PASS',checks=checks,production_version=h['version'],database_exists=h['storage']['db_exists'],market_snapshots_48h=h['storage']['market_snapshots_48h'],push_subscribers=pc['subscribers'],policy=pc['notification_policy'],paper_metrics=p['metrics'],shadow_metrics=shadow['metrics'],btc_metrics=btc['metrics'],btc_snapshot_age_seconds=btc['snapshot_age_seconds'],shipped_javascript='PASS',notifications_sent_by_test=False,subscription_mutations=False,private_orders=False)
          (out/'summary.json').write_text(json.dumps(summary,indent=2,allow_nan=False))
          print(json.dumps({k:v for k,v in summary.items() if k not in ['checks','shadow_metrics','btc_metrics']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-entry-live-smoke
          path: live-output/
          retention-days: 14

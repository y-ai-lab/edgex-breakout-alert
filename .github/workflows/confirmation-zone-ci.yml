name: Confirmation zone registered research validation
on:
  push:
    branches: [audit/confirmation-zone-v19-0-31]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis_terminal/test-requirements.txt
      - name: Regression and chronology checks
        run: |
          mkdir -p validation-output
          python -m unittest discover -s analysis_terminal -p 'test_*.py' -q > validation-output/analysis-tests.txt 2>&1
          python -m unittest discover -s tests -q > validation-output/root-tests.txt 2>&1
          python -m compileall -q analysis_terminal
          python -m analysis_terminal.pending_followup --scheduled --output validation-output/calendar
      - name: Confirm existing strategies, frozen protocols, UI and notifications unchanged
        run: |
          python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          parent='266edafeaae1153527d5c45105d3f359d92af241'
          def prior(p):return subprocess.check_output(['git','show',parent+':'+p])
          old=prior('analysis_terminal/server.py').decode();new=Path('analysis_terminal/server.py').read_text()
          def function(s,name):return ast.dump(next(n for n in ast.parse(s).body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name==name),include_attributes=False)
          for name in ['analyze_contract','_evaluate_paper_signal','_persist_shadow_v2_signals','_maybe_push_candidate_changes','_persist_scan_result','_background_collector']:
              assert function(old,name)==function(new,name),name
          for p in ['app.py','production_app.py','Dockerfile','requirements.txt','analysis_terminal/index.html','analysis_terminal/btc.html','analysis_terminal/sw.js','analysis_terminal/outcomes.py','analysis_terminal/lifecycle.py','analysis_terminal/paper_execution.py','analysis_terminal/entry_history.py','analysis_terminal/pending_entry_protocol.json','analysis_terminal/pending_entry_replay.py','analysis_terminal/pending_followup.py','analysis_terminal/pending_followup_protocol.json']:
              assert prior(p)==Path(p).read_bytes(),p
          assert subprocess.check_output(['git','show','9c93cf647c7f7f08336530fffc76421bcfd0be47:analysis_terminal/confirmation_zone_protocol.json'])==Path('analysis_terminal/confirmation_zone_protocol.json').read_bytes()
          PY
      - name: Download pinned frozen ledgers and market candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/y-ai-lab/edgex-breakout-alert/actions/artifacts/11262672328/zip > development.zip
          gh api repos/y-ai-lab/edgex-breakout-alert/actions/artifacts/11430177364/zip > validation.zip
          gh api repos/y-ai-lab/edgex-breakout-alert/actions/artifacts/11431586665/zip > frozen.zip
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          digests={'development':'163fb6eb7947f1284dcb953d0bb8e39f1f1535a71b5778260c2a373c4f7c8a9c','validation':'820cc3a94c876f569e9eb410829d89f5d4af7fc5c90470d4d50071046ca0b1df','frozen':'21b77e1ef3396504d15db3c3832190834b77519ff545540389d28bd8ddeb634b'}
          for name,digest in digests.items():
              raw=Path(name+'.zip').read_bytes();assert hashlib.sha256(raw).hexdigest()==digest
              out=Path('source-input')/name;out.mkdir(parents=True)
              with zipfile.ZipFile(Path(name+'.zip')) as z:
                  for info in z.infolist():assert (out/info.filename).resolve().is_relative_to(out.resolve())
                  z.extractall(out)
          PY
      - name: Replay registered net-2R prices and keep original controls immutable
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from analysis_terminal import confirmation_zone_replay as study,server
          expected=json.loads(Path('analysis_terminal/confirmation_zone_latest.json').read_text())
          hashes={'development':'37353c224ff1b1b373e1727f8c5f5e04096042a61bb6db21406d2eccd60630eb','validation':'2653aa03770e1cbabd2bb80d818b3ae2d70d4f718ffbf72586699e33289b6631'}
          out=Path('validation-output/confirmation-zone');out.mkdir()
          results=[]
          for role,digest in hashes.items():
              sources=list((Path('source-input')/role).rglob('replay-report.json'));assert len(sources)==1
              ledgers=list(Path('source-input/frozen').rglob(role+'/report.json'));assert len(ledgers)==1
              original=ledgers[0].read_bytes();assert hashlib.sha256(original).hexdigest()==digest
              result=study.build(sources[0].parent,server.analyze_contract,server.SETTINGS,role=role,baseline_path=ledgers[0]);results.append(result)
              wanted=next(p for p in expected['periods'] if p['role']==role)
              for field in ['metrics','portfolios','comparison','first_shadow_seeds','seed_exclusions','protocol_sha256','engine_sha256']:
                  assert result[field]==wanted[field],field
              assert result['source_files_verified']==182
              assert ledgers[0].read_bytes()==original
              assert not result['changes_live_rules'] and not result['automatic_promotion'] and not result['real_orders_enabled']
              (out/(role+'.json')).write_text(json.dumps(result,indent=2,allow_nan=False)+'\n')
              print(json.dumps({'role':role,'metrics':result['metrics'][study.MODEL],'comparison':result['comparison']}))
          assert study.decision(results)==expected['decision']=='KILL_NO_LIVE_PROMOTION'
          assert not expected['forward_collection_enabled']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmation-zone-validation
          path: validation-output/
          retention-days: 14

name: BTC recorded-market browser validation
'on':
  push:
    branches:
    - audit/btc-wave-v19-0-23-browser
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r analysis_terminal/test-requirements.txt
    - name: Four chart switches and mobile layout using recorded public candles
      run: "python -m pip install playwright\npython -m playwright install --with-deps\
        \ chromium\npython - <<'PYB'\nimport json\nfrom pathlib import Path\nfrom\
        \ playwright.sync_api import sync_playwright\nimport json,sqlite3,threading\n\
        from http.server import BaseHTTPRequestHandler,HTTPServer\nfrom pathlib import\
        \ Path\nimport app\nfrom analysis_terminal.btc_wave import analyze\nfrom analysis_terminal.btc_wave_store\
        \ import initialize,save,report\nd=json.loads(Path('audit-input/public-btc.json').read_text())\n\
        contract=app.Contract(**d['contract']); data={i:[app.Candle(**c) for c in\
        \ rows] for i,rows in d['series'].items()}\nlatest=analyze(contract,data,now_ms=d['observed_ms']);conn=sqlite3.connect(':memory:');initialize(conn);save(conn,latest)\n\
        envelope=report(conn,now_ms=d['observed_ms'],latest=latest)\nclass Handler(BaseHTTPRequestHandler):\n\
        \    def do_GET(self):\n        if self.path.startswith('/api/btc-wave'):raw=json.dumps(envelope);kind='application/json'\n\
        \        elif self.path.startswith('/api/screener'):raw=json.dumps(dict(snapshot_age_seconds=0,ready_candidates=[],summary=dict(ready_count=0)));kind='application/json'\n\
        \        elif self.path=='/btc':raw=Path('analysis_terminal/btc.html').read_text().replace('__APP_VERSION__','19.0.23');kind='text/html;\
        \ charset=utf-8'\n        else:self.send_response(404);self.end_headers();return\n\
        \        self.send_response(200);self.send_header('Content-Type',kind);self.end_headers();self.wfile.write(raw.encode())\n\
        \    def log_message(self,*args):pass\nserver=HTTPServer(('127.0.0.1',8765),Handler);threading.Thread(target=server.serve_forever,daemon=True).start()\n\
        out=Path('browser-output');out.mkdir(exist_ok=True); checks=[]\nwith sync_playwright()\
        \ as p:\n    browser=p.chromium.launch()\n    for name,width,height in [('mobile',390,844),('desktop',1280,900)]:\n\
        \        page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)\n\
        \        errors=[]\n        page.on('pageerror',lambda e:errors.append(str(e)))\n\
        \        response=page.goto('http://127.0.0.1:8765/btc',wait_until='networkidle',timeout=60000)\n\
        \        assert response.status==200\n        page.wait_for_function(\"document.querySelectorAll('#frames\
        \ .frame').length === 4\",timeout=30000)\n        page.wait_for_function(\"\
        document.querySelector('#productionEntry').textContent.includes('本番ENTRY')\"\
        ,timeout=30000)\n        assert page.locator('#waveStatus').inner_text() not\
        \ in ['BTCデータを読み込み中','データ鮮度を確認']\n        for interval in ['HOUR_4','HOUR_1','MINUTE_15','MINUTE_5']:\n\
        \            page.locator('[data-interval=\"'+interval+'\"]').click()\n  \
        \          canvas=page.locator('#waveChart'); box=canvas.bounding_box()\n\
        \            assert box['width']>250 and box['height']>100\n            canvas.hover(position={'x':box['width']/2,'y':box['height']/2})\n\
        \            assert 'チャートに触れると' not in page.locator('#chartTooltip').inner_text()\n\
        \        page.locator('[data-interval=\"MINUTE_15\"]').click()\n        assert\
        \ page.locator('#plans .plan').count()==4\n        assert page.evaluate('document.documentElement.scrollWidth\
        \ <= innerWidth + 1'), 'Horizontal page overflow'\n        page.locator('details\
        \ summary').click()\n        assert 'INSUFFICIENT SAMPLE' in page.locator('#researchStatus').inner_text()\
        \ or 'REVIEW_REQUIRED' in page.locator('#researchStatus').inner_text()\n \
        \       page.screenshot(path=str(out/(name+'-btc.png')),full_page=True)\n\
        \        checks.append({'viewport':name,'width':width,'plans':4,'javascript_errors':errors,'horizontal_overflow':False,'four_chart_switches':'PASS','wave_status':page.locator('#waveStatus').inner_text()})\n\
        \        assert not errors, errors\n        page.close()\n    browser.close()\n\
        (out/'browser-summary.json').write_text(json.dumps({'verdict':'PASS','data_kind':'RECORDED_REAL_MARKET_FIXTURE_NOT_PRODUCTION','checks':checks},ensure_ascii=False,indent=2))\n\
        PYB\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: btc-wave-recorded-browser
        path: browser-output/
        retention-days: 7


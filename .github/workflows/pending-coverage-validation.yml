name: Pending Shadow coverage audit regressions
on:
  push:
    branches: [audit/pending-coverage-v19-0-38]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis_terminal/test-requirements.txt
      - name: Full regressions
        run: |
          mkdir -p validation-output
          python -m unittest discover -s analysis_terminal -p 'test_*.py' -q > validation-output/analysis-tests.txt 2>&1
          python -m unittest discover -s tests -q > validation-output/root-tests.txt 2>&1
          python -m unittest discover -s .github/scripts -p 'test_*.py' -q > validation-output/review-tests.txt 2>&1
          python -m compileall -q analysis_terminal
      - name: Frozen signals and strategies preserved
        run: |
          python - <<'PY'
          import ast,subprocess,types
          from pathlib import Path
          from unittest.mock import patch
          from analysis_terminal import pending_live as current, test_pending_live as fixture
          from analysis_terminal.test_pending_entry_replay import candle
          parent='e6c10cd6a6ff8e7f17f2237288d3f96eea70718c'
          changed={'analysis_terminal/pending_live.py','analysis_terminal/test_pending_live.py','analysis_terminal/PENDING_LIVE_CAPTURE.md','analysis_terminal/server.py','.github/workflows/pending-coverage-validation.yml'}
          assert set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD']).decode().splitlines())==changed
          previous=subprocess.check_output(['git','show',parent+':analysis_terminal/server.py']).decode()
          assert previous.replace('version="19.0.37"','version="19.0.38"')==Path('analysis_terminal/server.py').read_text()
          prior=subprocess.check_output(['git','show',parent+':analysis_terminal/pending_live.py']).decode()
          def funcs(s):return {n.name:ast.dump(n,include_attributes=False) for n in ast.parse(s).body if isinstance(n,ast.FunctionDef)}
          old,new=funcs(prior),funcs(Path(current.__file__).read_text())
          for name in ['records','_save','_consume','_closed_window','_advance','record_error']:
              assert old[name]==new[name],name
          legacy=types.ModuleType('legacy_capture');legacy.__file__=current.__file__
          exec(compile(prior,current.__file__,'exec'),legacy.__dict__)
          def run(impl,side,scenario):
              with patch.object(fixture,'live',impl):
                  x=fixture.PendingLiveTests();x.setUp()
                  try:
                      r=x.capture(side);start,step=fixture.START,fixture.STEP
                      fill=candle(start+step,open=101,low=95,high=102) if side=='LONG' else candle(start+step,open=99,low=98,high=105,close=99)
                      exit=candle(start+2*step,open=110,low=109,high=121,close=120) if side=='LONG' else candle(start+2*step,open=90,low=79,high=91,close=80)
                      if scenario=='ambiguous':fill=candle(start+step,low=80,high=130)
                      if scenario!='expired':x.overrides.update({fill.time_ms:fill,exit.time_ms:exit})
                      for i in range(1,6):
                          if scenario=='gap' and i==1:continue
                          x.cycle(start+i*step)
                      report=x.review()
                      return impl.records(x.conn),report['cohorts'],report['continuous_portfolios']
                  finally:x.tearDown()
          cases=[]
          for side in ['LONG','SHORT']:
              for scenario in ['tp','ambiguous','gap','expired']:
                  assert run(legacy,side,scenario)==run(current,side,scenario),(side,scenario)
                  cases.append(side+':'+scenario)
          Path('validation-output/unchanged-ledgers.json').write_text(__import__('json').dumps({'cases':cases,'identical_records_cohorts_and_continuous_portfolios':True}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-coverage-validation
          path: validation-output/
          retention-days: 14

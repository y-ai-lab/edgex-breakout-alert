name: Completion metrics independent validation
on:
  push:
    branches: [audit/completion-metrics-v19-0-25]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis_terminal/test-requirements.txt
      - run: python -m unittest discover -s analysis_terminal -p 'test_*.py'
      - run: python -m unittest discover -s tests
      - name: Captured full live cohort and unchanged strategy
        run: |
          python - <<'PY'
          import ast,base64,gzip,json,subprocess
          from pathlib import Path
          from analysis_terminal.comparison import strategy_comparison
          raw=gzip.decompress(base64.b64decode(Path('audit-input/cost-records.json.gz.b64').read_text()))
          records=json.loads(raw)
          actual=strategy_comparison(records['current'],records['shadow'],limit=1)
          expected=json.loads(Path('analysis_terminal/completion_review_latest.json').read_text())
          assert actual['cost_adjusted']==expected['cost_adjusted']
          old_cost=json.loads(Path('analysis_terminal/cost_review_latest.json').read_text())['cost_adjusted']
          for name in ('current','shadow'):
              assert {k:v for k,v in actual['cost_adjusted'][name].items() if k!='completion'}==old_cost[name]
          assert actual['cost_adjusted']['shadow']['completion']['unresolved_or_excluded']==48
          assert actual['cost_adjusted']['shadow']['completion']['sensitivity']['scenarios']['all_open_sl']['avg_net_r']==-.5736
          assert not actual['cost_adjusted']['shadow']['automatic_promotion']
          for name in ('current','shadow'):assert actual[name]==expected['gross'][name]
          old=subprocess.check_output(['git','show','21081208a84d82b54b734e6e3ca92291615c3802:analysis_terminal/server.py'],text=True)
          new=Path('analysis_terminal/server.py').read_text()
          def strategy(s):return ast.dump(next(n for n in ast.parse(s).body if isinstance(n,ast.FunctionDef) and n.name=='analyze_contract'),include_attributes=False)
          assert strategy(old)==strategy(new)
          for p in ['app.py','production_app.py','Dockerfile','requirements.txt','analysis_terminal/index.html','analysis_terminal/btc.html','analysis_terminal/sw.js']:
              assert subprocess.check_output(['git','show','21081208a84d82b54b734e6e3ca92291615c3802:'+p])==Path(p).read_bytes(),p
          Path('validation-output').mkdir()
          Path('validation-output/market-completion-review.json').write_text(json.dumps(actual['cost_adjusted'],indent=2,allow_nan=False))
          print('PASS: full 107-setup market cohort; unchanged gross metrics, strategy, UI, notification service')
          PY
      - name: Build production container and check endpoints
        run: |
          docker build -f analysis_terminal/Dockerfile -t edgex-cost-test .
          docker run -d --name edgex-cost-test -p 8000:8000 -e ANALYSIS_DB_PATH=/data/analysis_terminal.db edgex-cost-test
          python - <<'PY'
          import json,time,urllib.request
          def get(p):
              with urllib.request.urlopen('http://localhost:8000'+p,timeout=10) as r:return json.load(r)
          for i in range(40):
              try:h=get('/health');break
              except Exception:time.sleep(2)
          else:raise AssertionError('Container did not start')
          assert h['version']=='19.0.25' and h['storage']['db_exists']
          c=get('/api/strategy-comparison')
          assert c['cost_adjusted']['shadow']['resolved']==0
          assert c['cost_adjusted']['shadow']['completion']['status']=='EMPTY'
          assert not c['cost_adjusted']['shadow']['completion']['sensitivity']['available']
          s=get('/api/shadow-v2')
          assert s['cost_adjusted']['resolved']==0
          assert not s['cost_adjusted']['real_execution_results']
          print('PASS: actual production Dockerfile, dependency imports, additive API fields, DB initialization')
          PY
          docker stop edgex-cost-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-metrics-independent-validation
          path: validation-output/
          retention-days: 14

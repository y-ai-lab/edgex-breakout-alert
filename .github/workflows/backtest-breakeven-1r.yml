name: Backtest 1R breakeven pivot
on:
  push:
    branches: [backtest/breakeven-1r-pivot]
    paths:
      - 'backtest_breakeven_1r.py'
      - '.github/workflows/backtest-breakeven-1r.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EDGEX_EQUITY_USDC: '24'
      EDGE_X_RISK_PER_TRADE: '0.05'
      EDGE_X_MONITOR_INTERVAL: 'HOUR_4'
      EDGE_X_ENTRY_INTERVAL: 'MINUTE_15'
      EDGE_X_MIN_RR: '2'
      EDGE_X_SPLIT_RR: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run 1R breakeven backtest
        run: python backtest_breakeven_1r.py
